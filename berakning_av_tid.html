<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Läkemedelsberäkning – Omvandling av tid</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 480px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Omvandling av tid</h1>
        <p id="problem"></p>
        <button onclick="generateProblem()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="text" id="answer" placeholder="Ditt svar">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result"></p>
        <p id="calculation"></p>
    </div>
    <script>
        const decimalHours = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 3, 4, 6, 8, 12];
        const wholeHours = [1, 2, 3, 4, 5, 6, 8, 10, 12];
        const extraMinutes = [15, 30, 45];

        let correctAnswer, answerUnit, calcText;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function formatNumber(value) {
            return Number(value.toFixed(2)).toString().replace(".", ",");
        }

        function generateProblem() {
            const caseType = Math.floor(Math.random() * 4);

            if (caseType === 0) {
                const hours = pick(decimalHours);
                correctAnswer = hours * 60;
                answerUnit = "minuter";
                calcText = `${formatNumber(hours)} timmar × 60 = ${correctAnswer} minuter`;
                document.getElementById("problem").textContent =
                    `En infusion ska pågå i ${formatNumber(hours)} timmar. Hur många minuter motsvarar detta?`;
            } else if (caseType === 1) {
                const hours = pick(decimalHours);
                const minutes = hours * 60;
                correctAnswer = hours;
                answerUnit = "timmar";
                calcText = `${minutes} minuter ÷ 60 = ${formatNumber(correctAnswer)} timmar`;
                document.getElementById("problem").textContent =
                    `En infusion ska pågå i ${minutes} minuter. Hur många timmar motsvarar detta uttryckt som decimaltal?`;
            } else if (caseType === 2) {
                const hours = pick(wholeHours);
                const minutes = pick(extraMinutes);
                correctAnswer = hours * 60 + minutes;
                answerUnit = "minuter";
                calcText = `${hours} timmar × 60 + ${minutes} minuter = ${correctAnswer} minuter`;
                document.getElementById("problem").textContent =
                    `En behandling ska pågå i ${hours} timmar och ${minutes} minuter. Hur många minuter är det sammanlagt?`;
            } else {
                const hours = pick(wholeHours);
                const minutes = pick(extraMinutes);
                const totalMinutes = hours * 60 + minutes;
                correctAnswer = minutes;
                answerUnit = "minuter";
                calcText = `${totalMinutes} minuter − (${hours} × 60 minuter) = ${correctAnswer} minuter`;
                document.getElementById("problem").textContent =
                    `${totalMinutes} minuter motsvarar ${hours} hela timmar och hur många minuter?`;
            }

            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit}:`;
            document.getElementById("answer").value = "";
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const userAnswer = Number(rawAnswer);

            if (rawAnswer === "" || !Number.isFinite(userAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (Math.abs(userAnswer - correctAnswer) < 0.001) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Det rätta svaret är ${formatNumber(correctAnswer)} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calcText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = generateProblem;
    </script>
<script src="exam_bridge.js"></script>
</body>
</html>
