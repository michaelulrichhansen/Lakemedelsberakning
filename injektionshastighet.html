<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Läkemedelsberäkning – Injektionshastighet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; }
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 520px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001; }
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa; }
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px; }
        #calculation { color: #555; }
        @media (max-width: 500px) { body { margin: 16px; } .card { max-width: none; padding: 20px; } h1 { font-size: 1.8rem; } label { display: block; } input[type="number"], input[type="text"] { width: 100%; box-sizing: border-box; } button { display: block; width: 100%; margin-top: 12px; } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Injektionshastighet</h1>
        <p id="problem"></p>
        <button onclick="randomizeCase()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="text" id="answer" inputmode="decimal" placeholder="">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result" aria-live="polite"></p>
        <p id="calculation"></p>
        <p style="font-size:0.95em;color:#444;">Avrunda svaret till två decimaler vid behov. Både punkt och komma accepteras som decimaltecken.</p>
        <p style="margin-top:24px;"><a href="index.html" target="_top" style="color:#1166cc;text-decoration:none;">← Till startsidan</a></p>
    </div>

    <script>
        const ratesMgMin = [0.2, 0.25, 0.4, 0.5, 0.6, 0.75, 0.8, 1, 1.2, 1.5, 2];
        const strengthsMgMl = [2.5, 5, 10, 20, 25, 50];
        const timesMin = [5, 10, 15, 20, 25, 30];
        let correctAnswer = 0;
        let calcText = "";
        let answerUnit = "";
        let answerDecimals = 2;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function formatNumber(value, maxDecimals = 2) {
            return Number(value.toFixed(maxDecimals)).toString().replace(".", ",");
        }

        function randomizeCase() {
            answerDecimals = 2;
            // Fyra av fem uppgifter är flerstegsuppgifter som i exemplet.
            const type = Math.floor(Math.random() * 5);
            const strength = pick(strengthsMgMl);
            const rate = pick(ratesMgMin);
            let problemText = "";

            if (type < 4) {
                // mg/min + mg/mL + tid -> total mL
                const time = pick(timesMin);
                const volumePerMinute = rate / strength;
                correctAnswer = volumePerMinute * time;
                answerUnit = "mL";

                const wordings = [
                    `En patient ska få en injektionshastighet på <strong>${formatNumber(rate)} mg/minut</strong>. Läkemedlet kommer i en styrka på <strong>${formatNumber(strength)} mg/mL</strong>. Efter <strong>${time} minuter</strong>, hur många <strong>mL</strong> av läkemedlet har patienten fått?`,
                    `Ett läkemedel ordineras med hastigheten <strong>${formatNumber(rate)} mg/minut</strong>. Tillgänglig styrka är <strong>${formatNumber(strength)} mg/mL</strong>. Hur stor volym i <strong>mL</strong> har administrerats efter <strong>${time} minuter</strong>?`,
                    `Patienten får ett läkemedel med injektionshastigheten <strong>${formatNumber(rate)} mg/minut</strong>. Lösningen innehåller <strong>${formatNumber(strength)} mg/mL</strong>. Hur många <strong>mL</strong> ges sammanlagt under <strong>${time} minuter</strong>?`,
                    `En injektion ges kontinuerligt med <strong>${formatNumber(rate)} mg/minut</strong>. Läkemedlets styrka är <strong>${formatNumber(strength)} mg/mL</strong>. Beräkna hur många <strong>mL</strong> patienten får på <strong>${time} minuter</strong>.`
                ];
                problemText = wordings[type];
                calcText = `${formatNumber(rate)} mg/min ÷ ${formatNumber(strength)} mg/mL = ${formatNumber(volumePerMinute, 4)} mL/min<br>${formatNumber(volumePerMinute, 4)} mL/min × ${time} min = <strong>${formatNumber(correctAnswer)} mL</strong>`;
            } else {
                // mg/min + mg/mL -> mL/min
                correctAnswer = rate / strength;
                answerUnit = "mL/min";
                problemText = `Ett läkemedel ordineras med doshastigheten <strong>${formatNumber(rate)} mg/minut</strong>. Läkemedlets styrka är <strong>${formatNumber(strength)} mg/mL</strong>. Vilken volymhastighet ska användas, uttryckt i <strong>mL/minut</strong>?`;
                calcText = `${formatNumber(rate)} mg/min ÷ ${formatNumber(strength)} mg/mL = <strong>${formatNumber(correctAnswer)} mL/min</strong>`;
            }

            document.getElementById("problem").innerHTML = problemText;
            document.getElementById("answerLabel").textContent = `Ange antal ${answerUnit} (två decimaler):`;
            document.getElementById("answer").value = "";
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").innerHTML = "";
            document.getElementById("answer").focus();
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const userAnswer = Number(rawAnswer);
            const factor = 10 ** answerDecimals;
            const roundedCorrect = Math.round((correctAnswer + Number.EPSILON) * factor) / factor;

            if (rawAnswer === "" || !Number.isFinite(userAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#b33";
                document.getElementById("calculation").innerHTML = "";
                return;
            }

            // Godkänn svaret avrundat till två decimaler, med liten tolerans.
            if (Math.abs(userAnswer - roundedCorrect) < 0.005) {
                document.getElementById("result").textContent = `Rätt! Svaret är ${formatNumber(roundedCorrect)} ${answerUnit}.`;
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Inte riktigt. Rätt svar är ${formatNumber(roundedCorrect)} ${answerUnit}.`;
                document.getElementById("result").style.color = "#b33";
            }

            document.getElementById("calculation").innerHTML = `<strong>Beräkning:</strong><br>${calcText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        randomizeCase();
    </script>
<script src="exam_bridge.js"></script>
</body>
</html>
