<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Läkemedelsberäkning – Procenträkning</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 530px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
        #formula { font-size: 0.97em; color: #666; background: #f0f0f8; border-radius: 7px; padding: 10px; margin-bottom: 12px;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Procenträkning</h1>
        <div id="formula">
            <b>Grunder:</b><br>
            <b>1 g/100 mL = 1 % (w/v)</b><br>
            <b>1 g/100 g = 1 % (w/w)</b><br>
            <b>1 mL/100 mL = 1 % (v/v)</b>
        </div>
        <p id="problem"></p>
        <button onclick="randomizeCase()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="text" id="answer" placeholder="Ditt svar">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result"></p>
        <p id="calculation"></p>
        <p style="font-size:0.95em;color:#444;">Avrunda till två decimaler vid behov. Både punkt och komma accepteras.</p>
    </div>
    <script>
        const percentages = [0.5, 1, 2, 2.5, 5, 10, 20];
        const totals = [100, 200, 250, 500, 1000];
        const percentageTypes = [
            { code: "w/v", activeUnit: "g", totalUnit: "mL", product: "lösning", activeName: "läkemedel" },
            { code: "w/w", activeUnit: "g", totalUnit: "g", product: "salva", activeName: "aktiv substans" },
            { code: "v/v", activeUnit: "mL", totalUnit: "mL", product: "lösning", activeName: "substans" }
        ];

        let percent, total, activeAmount, selectedType, questionDirection;
        let correctAnswer, answerUnit, calcText;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function formatNumber(value) {
            return Number(value.toFixed(2)).toString().replace(".", ",");
        }

        function randomizeCase() {
            percent = pick(percentages);
            total = pick(totals);
            activeAmount = (percent * total) / 100;
            selectedType = pick(percentageTypes);
            questionDirection = Math.floor(Math.random() * 3);

            if (questionDirection === 0) {
                correctAnswer = activeAmount;
                answerUnit = selectedType.activeUnit;
                document.getElementById("problem").textContent =
                    `Hur många ${selectedType.activeUnit} ${selectedType.activeName} behövs för att bereda ${total} ${selectedType.totalUnit} ${selectedType.product} med styrkan ${formatNumber(percent)} % (${selectedType.code})?`;
                calcText = `${formatNumber(percent)} ${selectedType.activeUnit}/100 ${selectedType.totalUnit} × ${total} ${selectedType.totalUnit} = ${formatNumber(correctAnswer)} ${selectedType.activeUnit}`;
            } else if (questionDirection === 1) {
                correctAnswer = percent;
                answerUnit = `% (${selectedType.code})`;
                document.getElementById("problem").textContent =
                    `En ${selectedType.product} innehåller ${formatNumber(activeAmount)} ${selectedType.activeUnit} ${selectedType.activeName} i totalt ${total} ${selectedType.totalUnit}. Vilken är styrkan i procent (${selectedType.code})?`;
                calcText = `${formatNumber(activeAmount)} ${selectedType.activeUnit} ÷ ${total} ${selectedType.totalUnit} × 100 = ${formatNumber(correctAnswer)} % (${selectedType.code})`;
            } else {
                correctAnswer = total;
                answerUnit = selectedType.totalUnit;
                document.getElementById("problem").textContent =
                    `Du har ${formatNumber(activeAmount)} ${selectedType.activeUnit} ${selectedType.activeName} och ska bereda en ${selectedType.product} med styrkan ${formatNumber(percent)} % (${selectedType.code}). Hur stor total mängd i ${selectedType.totalUnit} kan beredas?`;
                calcText = `${formatNumber(activeAmount)} ${selectedType.activeUnit} × 100 ${selectedType.totalUnit} ÷ ${formatNumber(percent)} ${selectedType.activeUnit} = ${formatNumber(correctAnswer)} ${selectedType.totalUnit}`;
            }

            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit}:`;
            document.getElementById("answer").value = "";
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const userAnswer = Number(rawAnswer);
            const roundedCorrect = Math.round((correctAnswer + Number.EPSILON) * 100) / 100;

            if (rawAnswer === "" || !Number.isFinite(userAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (Math.abs(userAnswer - roundedCorrect) < 0.005) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Rätt svar är ${formatNumber(roundedCorrect)} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calcText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = randomizeCase;
    </script>
</body>
</html>
