<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Läkemedelsberäkning – Enklare spädningar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 520px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
        @media (max-width: 500px) { body { margin: 16px; } .card { max-width: none; padding: 20px; } h1 { font-size: 1.8rem; } label { display: block; } input[type="number"], input[type="text"] { width: 100%; box-sizing: border-box; } button { display: block; width: 100%; margin-top: 12px; } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Enklare spädningar</h1>
        <p id="question"></p>
        <button onclick="randomizeValues()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="number" id="answer" inputmode="decimal" placeholder="Heltal">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result" aria-live="polite"></p>
        <p id="calculation"></p>
        <p style="font-size:0.95em;color:#444;">Svara med ett heltal.</p>
        <p style="margin-top:24px;"><a href="index.html" target="_top" style="color:#1166cc;text-decoration:none;">← Till startsidan</a></p>
    </div>
    <script>
        const concentrationPairs = [
            { original: 10, target: 5 },
            { original: 20, target: 10 },
            { original: 25, target: 5 },
            { original: 40, target: 20 },
            { original: 50, target: 10 },
            { original: 50, target: 25 },
            { original: 100, target: 10 },
            { original: 100, target: 20 }
        ];
        const originalVolumes = [1, 2, 5, 10, 20];

        let originalStrength, targetStrength, originalVolume, finalVolume, diluentVolume;
        let questionType, correctAnswer, answerUnit, calculationText;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function randomizeValues() {
            const pair = pick(concentrationPairs);
            originalStrength = pair.original;
            targetStrength = pair.target;
            originalVolume = pick(originalVolumes);
            finalVolume = originalVolume * (originalStrength / targetStrength);
            diluentVolume = finalVolume - originalVolume;
            questionType = Math.floor(Math.random() * 4);

            if (questionType === 0) {
                correctAnswer = diluentVolume;
                answerUnit = "mL spädningsvätska";
                document.getElementById("question").textContent =
                    `Du har ${originalVolume} mL läkemedel med styrkan ${originalStrength} mg/mL. Läkemedlet ska spädas till styrkan ${targetStrength} mg/mL. Hur många mL spädningsvätska ska tillsättas?`;
                calculationText = `Slutvolym: (${originalStrength} mg/mL × ${originalVolume} mL) ÷ ${targetStrength} mg/mL = ${finalVolume} mL. Spädningsvätska: ${finalVolume} mL − ${originalVolume} mL = ${correctAnswer} mL`;
            } else if (questionType === 1) {
                correctAnswer = finalVolume;
                answerUnit = "mL slutvolym";
                document.getElementById("question").textContent =
                    `Du har ${originalVolume} mL läkemedel med styrkan ${originalStrength} mg/mL. Läkemedlet ska spädas till styrkan ${targetStrength} mg/mL. Vilken blir den totala slutvolymen i mL?`;
                calculationText = `(${originalStrength} mg/mL × ${originalVolume} mL) ÷ ${targetStrength} mg/mL = ${correctAnswer} mL`;
            } else if (questionType === 2) {
                correctAnswer = targetStrength;
                answerUnit = "mg/mL";
                document.getElementById("question").textContent =
                    `Du har ${originalVolume} mL läkemedel med styrkan ${originalStrength} mg/mL och tillsätter ${diluentVolume} mL spädningsvätska. Vilken styrka i mg/mL får den färdigspädda lösningen?`;
                calculationText = `Slutvolym: ${originalVolume} mL + ${diluentVolume} mL = ${finalVolume} mL. (${originalStrength} mg/mL × ${originalVolume} mL) ÷ ${finalVolume} mL = ${correctAnswer} mg/mL`;
            } else {
                correctAnswer = originalVolume;
                answerUnit = "mL läkemedel";
                document.getElementById("question").textContent =
                    `Du ska bereda ${finalVolume} mL lösning med styrkan ${targetStrength} mg/mL. Det koncentrerade läkemedlet har styrkan ${originalStrength} mg/mL. Hur många mL av det koncentrerade läkemedlet behövs?`;
                calculationText = `(${targetStrength} mg/mL × ${finalVolume} mL) ÷ ${originalStrength} mg/mL = ${correctAnswer} mL`;
            }

            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit} (heltal):`;
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
            document.getElementById("answer").value = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const studentAnswer = Number(rawAnswer);

            if (rawAnswer === "" || !Number.isFinite(studentAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (studentAnswer === correctAnswer) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Det rätta svaret är ${correctAnswer} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calculationText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = randomizeValues;
    </script>
<script src="exam_bridge.js?v=20260826-4"></script>
</body>
</html>
