<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Läkemedelsberäkning – Droppar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 480px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Droppar</h1>
        <p id="problem"></p>
        <button onclick="randomizeValues()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="text" id="answer" placeholder="Ditt svar">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result"></p>
        <p id="calculation"></p>
        <p style="font-size:0.95em;color:#444;">Avrunda till en decimal vid behov. Både punkt och komma accepteras.</p>
    </div>
    <script>
        const dropsPerMlValues = [15, 20, 25];
        const doseVolumes = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5];
        const bottleVolumes = [10, 15, 20, 30];

        let dropsPerMl, doseVolume, dropsPerDose, bottleVolume, numberOfDoses;
        let questionType, correctAnswer, answerUnit, calculationText;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function formatNumber(value) {
            return Number(value.toFixed(1)).toString().replace(".", ",");
        }

        function createConsistentValues() {
            do {
                dropsPerMl = pick(dropsPerMlValues);
                doseVolume = pick(doseVolumes);
                bottleVolume = pick(bottleVolumes);
                dropsPerDose = dropsPerMl * doseVolume;
                numberOfDoses = bottleVolume / doseVolume;
            } while (!Number.isInteger(dropsPerDose) || !Number.isInteger(numberOfDoses));
        }

        function randomizeValues() {
            createConsistentValues();
            questionType = Math.floor(Math.random() * 3);

            if (questionType === 0) {
                correctAnswer = doseVolume;
                answerUnit = "mL";
                document.getElementById("problem").textContent =
                    `En patient är ordinerad ${dropsPerDose} droppar av ett läkemedel. Enligt flaskans anvisning motsvarar ${dropsPerMl} droppar 1 mL. Hur många mL ska patienten få?`;
                calculationText = `${dropsPerDose} droppar ÷ ${dropsPerMl} droppar/mL = ${formatNumber(correctAnswer)} mL`;
            } else if (questionType === 1) {
                correctAnswer = dropsPerDose;
                answerUnit = "droppar";
                document.getElementById("problem").textContent =
                    `En patient ska få ${formatNumber(doseVolume)} mL av ett läkemedel. Enligt flaskans anvisning motsvarar ${dropsPerMl} droppar 1 mL. Hur många droppar ska patienten få?`;
                calculationText = `${formatNumber(doseVolume)} mL × ${dropsPerMl} droppar/mL = ${correctAnswer} droppar`;
            } else {
                correctAnswer = numberOfDoses;
                answerUnit = "doser";
                document.getElementById("problem").textContent =
                    `En flaska innehåller ${bottleVolume} mL läkemedel. En dos är ${dropsPerDose} droppar och ${dropsPerMl} droppar motsvarar 1 mL. Till hur många hela doser räcker flaskan?`;
                calculationText = `Dosvolym: ${dropsPerDose} droppar ÷ ${dropsPerMl} droppar/mL = ${formatNumber(doseVolume)} mL. ${bottleVolume} mL ÷ ${formatNumber(doseVolume)} mL/dos = ${correctAnswer} doser`;
            }

            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit}:`;
            document.getElementById("answer").value = "";
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const studentAnswer = Number(rawAnswer);

            if (rawAnswer === "" || !Number.isFinite(studentAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (Math.abs(studentAnswer - correctAnswer) < 0.001) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Rätt svar är ${formatNumber(correctAnswer)} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calculationText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = randomizeValues;
    </script>
</body>
</html>
