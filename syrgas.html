<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Läkemedelsberäkning syrgas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 540px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"], input[type="text"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning syrgas</h1>
        <p id="problem"></p>
        <button onclick="randomizeCase()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer"></label>
        <input type="text" id="answer" placeholder="Svara med heltal">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result"></p>
        <p id="calculation"></p>
        <p style="font-size:0.95em;color:#444;">
            Svara med ett heltal. Både punkt och komma accepteras som decimaltecken.
        </p>
    </div>
    <script>
        const cylinderVolumes = [2, 3, 5, 10];
        const pressures = [50, 75, 100, 120, 150, 180, 200];
        const flows = [1, 2, 3, 4, 5, 6, 8, 10];

        let cylinderVolume, pressure, flow, totalVolume, durationMinutes;
        let caseType, correctAnswer, answerUnit, calcText;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function createValues() {
            do {
                cylinderVolume = pick(cylinderVolumes);
                pressure = pick(pressures);
                flow = pick(flows);
                totalVolume = cylinderVolume * pressure;
                durationMinutes = totalVolume / flow;
            } while (!Number.isInteger(durationMinutes) || durationMinutes < 30 || durationMinutes > 600);
        }

        function randomizeCase() {
            createValues();
            caseType = Math.floor(Math.random() * 3);

            if (caseType === 0) {
                correctAnswer = totalVolume;
                answerUnit = "liter";
                calcText = `${cylinderVolume} L × ${pressure} bar = ${correctAnswer} liter syrgas`;
                document.getElementById("problem").textContent =
                    `En syrgasflaska har en flaskvolym på ${cylinderVolume} L och manometern visar ${pressure} bar. Hur många liter syrgas innehåller flaskan?`;
            } else if (caseType === 1) {
                correctAnswer = durationMinutes;
                answerUnit = "minuter";
                calcText = `${cylinderVolume} L × ${pressure} bar = ${totalVolume} liter. ${totalVolume} liter ÷ ${flow} L/min = ${correctAnswer} minuter`;
                document.getElementById("problem").textContent =
                    `En syrgasflaska har en flaskvolym på ${cylinderVolume} L och manometern visar ${pressure} bar. Patienten får ${flow} L syrgas/minut. Hur många minuter räcker flaskan?`;
            } else {
                correctAnswer = flow;
                answerUnit = "L/min";
                calcText = `${cylinderVolume} L × ${pressure} bar = ${totalVolume} liter. ${totalVolume} liter ÷ ${durationMinutes} min = ${correctAnswer} L/min`;
                document.getElementById("problem").textContent =
                    `En syrgasflaska har en flaskvolym på ${cylinderVolume} L och manometern visar ${pressure} bar. Syrgasen ska räcka i ${durationMinutes} minuter. Vilket flöde i L/min motsvarar detta?`;
            }

            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit} (heltal):`;
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
            document.getElementById("answer").value = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const userAnswer = Number(rawAnswer);

            if (rawAnswer === "" || !Number.isFinite(userAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (userAnswer === correctAnswer) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Rätt svar är ${correctAnswer} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calcText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = randomizeCase;
    </script>
</body>
</html>
