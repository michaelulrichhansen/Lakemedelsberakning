<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Läkemedelsberäkning – Kroppsvikt</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7;}
        h1 { color: #195; }
        .card { background: #fff; padding: 32px; max-width: 480px; margin: auto; border-radius: 16px; box-shadow: 0 6px 24px #0001;}
        label, input, button { font-size: 1rem; margin-top: 12px; }
        input[type="number"] { width: 140px; padding: 4px 10px; border-radius: 6px; border: 1px solid #aaa;}
        button { border-radius: 6px; padding: 8px 16px; border: none; background: #3b7; color: #fff; cursor: pointer; }
        #result { font-weight: bold; margin-top: 16px;}
        #calculation { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Läkemedelsberäkning<br>Kroppsvikt</h1>
        <p id="problem"></p>
        <button onclick="randomizeValues()">Slumpa värden</button>
        <br><br>
        <label id="answerLabel" for="answer">Ange ditt svar (heltal):</label>
        <input type="number" id="answer" placeholder="Skriv ditt svar här (heltal)">
        <button onclick="checkAnswer()">Kontrollera svar</button>
        <p id="result"></p>
        <p id="calculation"></p>
    </div>
    <script>
        const dosesPerKg = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40];
        const weightsKg = [5, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100];

        let dosePerKg, weight, totalDose, questionType, correctAnswer, calculationText, answerUnit;

        const pick = values => values[Math.floor(Math.random() * values.length)];

        function randomizeValues() {
            dosePerKg = pick(dosesPerKg);
            weight = pick(weightsKg);
            totalDose = dosePerKg * weight;
            questionType = Math.floor(Math.random() * 3);

            let problemText = "";

            if (questionType === 0) {
                correctAnswer = totalDose;
                answerUnit = "mg";
                problemText = `En patient väger <strong>${weight} kg</strong>. Läkemedlet ska doseras med <strong>${dosePerKg} mg/kg kroppsvikt</strong>. Hur stor total dos i <strong>mg</strong> ska patienten få?`;
                calculationText = `${dosePerKg} mg/kg × ${weight} kg = ${correctAnswer} mg`;
            } else if (questionType === 1) {
                correctAnswer = dosePerKg;
                answerUnit = "mg/kg";
                problemText = `En patient väger <strong>${weight} kg</strong> och ska få en total dos på <strong>${totalDose} mg</strong>. Hur många <strong>mg/kg kroppsvikt</strong> motsvarar detta?`;
                calculationText = `${totalDose} mg ÷ ${weight} kg = ${correctAnswer} mg/kg`;
            } else {
                correctAnswer = weight;
                answerUnit = "kg";
                problemText = `Ett läkemedel ska doseras med <strong>${dosePerKg} mg/kg kroppsvikt</strong>. Patienten ska få en total dos på <strong>${totalDose} mg</strong>. Hur mycket väger patienten i <strong>kg</strong>?`;
                calculationText = `${totalDose} mg ÷ ${dosePerKg} mg/kg = ${correctAnswer} kg`;
            }

            document.getElementById("problem").innerHTML = problemText;
            document.getElementById("answerLabel").textContent = `Ange ditt svar i ${answerUnit} (heltal):`;
            document.getElementById("result").textContent = "";
            document.getElementById("calculation").textContent = "";
            document.getElementById("answer").value = "";
        }

        function checkAnswer() {
            const rawAnswer = document.getElementById("answer").value.trim().replace(",", ".");
            const studentAnswer = Number(rawAnswer);

            if (rawAnswer === "" || !Number.isFinite(studentAnswer)) {
                document.getElementById("result").textContent = "Skriv ett giltigt tal.";
                document.getElementById("result").style.color = "#a33";
                document.getElementById("calculation").textContent = "";
                return;
            }

            if (studentAnswer === correctAnswer) {
                document.getElementById("result").textContent = "Rätt svar!";
                document.getElementById("result").style.color = "#195";
            } else {
                document.getElementById("result").textContent = `Fel svar. Det rätta svaret är ${correctAnswer} ${answerUnit}.`;
                document.getElementById("result").style.color = "#a33";
            }

            document.getElementById("calculation").textContent = `Beräkning: ${calculationText}`;
        }

        document.getElementById("answer").addEventListener("keydown", event => {
            if (event.key === "Enter") checkAnswer();
        });

        window.onload = randomizeValues;
    </script>
</body>
</html>
